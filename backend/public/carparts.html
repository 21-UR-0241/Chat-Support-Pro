<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Support Widget</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-brand:    #1448A0;
      --blue-mid:      #1E88E5;
      --blue-bg:       #EEF4FF;
      --text-primary:  #111827;
      --text-secondary:#6B7280;
      --text-muted:    #9CA3AF;
      --border:        rgba(0,0,0,.1);
      --border-strong: rgba(0,0,0,.18);
      --radius:        8px;
    }

    html, body {
      height: 100%; width: 100%;
    }
    body {
      display: flex; flex-direction: column;
      background: var(--blue-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0;
    }

    /* ── Shell ─────────────────────────────────────── */
    #phone {
      width: 100%; height: 100%; flex: 1;
      display: flex; flex-direction: column;
      background: #fff; overflow: hidden;
    }

    /* ── View container ────────────────────────────── */
    #view { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* ══════════════════════════════════════════════════
       FORM VIEW
    ══════════════════════════════════════════════════ */
    #form-view  { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #form-header {
      background: var(--blue-brand);
      padding-bottom: 28px;
      position: relative; text-align: center; flex-shrink: 0;
    }
    .fh-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: 2px solid rgba(255,255,255,.4);
      display: flex; align-items: center; justify-content: center;
      margin: 18px auto 10px;
    }
    .fh-title { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 5px; }
    .fh-sub   { color: rgba(255,255,255,.8); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .online-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; }
    .wave { position: absolute; bottom: 0; left: 0; width: 100%; display: block; }

    #form-body {
      flex: 1; background: var(--blue-bg); overflow-y: auto;
      padding: 16px; display: flex; flex-direction: column; align-items: center;
    }
    #form-body > .form-card,
    #form-body > p.form-note { width: 100%; max-width: 480px; }

    .form-card {
      background: #fff; border-radius: 16px;
      border: 0.5px solid var(--border); padding: 22px;
    }
    .form-card > p {
      font-size: 13px; color: var(--text-secondary);
      margin-bottom: 14px; line-height: 1.55;
    }
    .field-wrap  { margin-bottom: 13px; }
    .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
    .req-star    { color: #ef4444; }
    .field-opt   { font-size: 11px; color: var(--text-muted); font-weight: 400; }
    .field-input {
      width: 100%; padding: 10px 13px; border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      font-size: 14px; outline: none;
      background: #F7FAFF; color: var(--text-primary);
      font-family: inherit; transition: border-color .15s, box-shadow .15s;
    }
    .field-input:focus { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(30,136,229,.12); }
    .field-input.has-error { border-color: #ef4444; }
    .err-msg { font-size: 11.5px; color: #ef4444; margin-top: 4px; display: none; }

    .start-btn {
      width: 100%; padding: 12px;
      background: var(--blue-mid); color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, transform .1s;
    }
    .start-btn:hover  { background: var(--blue-brand); }
    .start-btn:active { transform: scale(.98); }

    .form-note {
      font-size: 11px; color: var(--text-muted);
      text-align: center; margin-top: 10px; line-height: 1.5;
    }

    /* ══════════════════════════════════════════════════
       CHAT VIEW
    ══════════════════════════════════════════════════ */
    #chat-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }

    #chat-header {
      background: var(--blue-brand);
      padding-bottom: 22px;
      position: relative; flex-shrink: 0;
    }
    .ch-inner { padding: 9px 14px 4px; display: flex; align-items: center; gap: 9px; }
    .back-btn {
      background: none; border: none; color: #fff;
      cursor: pointer; padding: 3px; font-size: 20px;
      display: flex; align-items: center; border-radius: 6px;
      transition: background .12s;
    }
    .back-btn:hover  { background: rgba(255,255,255,.15); }
    .back-btn:active { background: rgba(255,255,255,.25); }
    .ch-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      border: 1.5px solid rgba(255,255,255,.4);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ch-name   { color: #fff; font-size: 16px; font-weight: 600; margin-bottom: 1px; }
    .ch-status { color: rgba(255,255,255,.75); font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .opts-btn  {
      background: none; border: none; color: #fff;
      cursor: pointer; padding: 3px; font-size: 19px;
      display: flex; align-items: center; margin-left: auto;
      border-radius: 6px; transition: background .12s;
    }
    .opts-btn:hover { background: rgba(255,255,255,.15); }

    /* ── Messages ──────────────────────────────────── */
    #messages {
      flex: 1; overflow-y: auto; padding: 10px 16px 6px;
      display: flex; flex-direction: column; gap: 3px;
      background: var(--blue-bg);
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 4px; }

    .msg-row      { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 5px; }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--blue-mid);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #fff; font-size: 14px;
    }
    .msg-avatar.user-av {
      background: #DBEAFE; color: #1E40AF; font-weight: 700; font-size: 13px;
    }

    .bubble-wrap      { max-width: 70%; display: flex; flex-direction: column; }
    .bubble-wrap.user { align-items: flex-end; }

    .bubble { padding: 9px 13px; font-size: 14px; line-height: 1.47; word-break: break-word; }
    .bubble.agent {
      background: #fff; border: 0.5px solid rgba(0,0,0,.1);
      border-radius: 14px 14px 14px 3px; color: var(--text-primary);
    }
    .bubble.user {
      background: var(--blue-mid); color: #fff;
      border-radius: 14px 14px 3px 14px;
    }
    .bubble-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

    /* Typing */
    .typing-row {
      display: flex; align-items: flex-end; gap: 6px;
      margin-bottom: 6px; animation: fadeIn .2s ease;
    }
    .typing-bubble {
      background: #fff; border: 0.5px solid rgba(0,0,0,.1);
      border-radius: 14px 14px 14px 3px;
      padding: 10px 13px; display: flex; gap: 4px; align-items: center;
    }

    /* ── Input bar ─────────────────────────────────── */
    #inputbar {
      background: #fff; border-top: 0.5px solid var(--border);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .input-inner {
      flex: 1; background: var(--blue-bg);
      border-radius: 20px; padding: 7px 12px;
      display: flex; align-items: center; gap: 6px;
    }
    #msg-input {
      flex: 1; border: none; background: transparent;
      font-size: 14px; outline: none;
      color: var(--text-primary); font-family: inherit;
    }
    #msg-input::placeholder { color: var(--text-muted); }
    .bar-icon {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 18px;
      padding: 2px; display: flex; align-items: center;
      border-radius: 6px; transition: color .12s;
    }
    .bar-icon:hover { color: var(--blue-mid); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--blue-mid); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px; flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    .send-btn:disabled { background: #CBD5E1; cursor: default; }
    .send-btn:not(:disabled):hover  { background: var(--blue-brand); }
    .send-btn:not(:disabled):active { transform: scale(.94); }

    /* ── Animations ────────────────────────────────── */
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .msg-anim { animation: slideUp .22s ease both; }
    .dot {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: #94a3b8;
      animation: dotBounce 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
  </style>
</head>
<body>

<div id="phone">
  <div id="view">

    <!-- ══════════════════ FORM VIEW ══════════════════ -->
    <div id="form-view">
      <div id="form-header">
        <div class="fh-avatar">
          <i class="ti ti-headset" style="font-size:34px;color:#fff" aria-hidden="true"></i>
        </div>
        <p class="fh-title">Support Chat</p>
        <p class="fh-sub"><span class="online-dot"></span> We reply in minutes</p>
        <svg class="wave" viewBox="0 0 400 28" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,14 C100,28 300,0 400,14 L400,28 L0,28 Z" fill="#EEF4FF"/>
        </svg>
      </div>

      <div id="form-body">
        <div class="form-card">
          <p>Fill in your details below to connect with our support team.</p>

          <div class="field-wrap">
            <label class="field-label" for="f-email">
              Email <span class="req-star">*</span>
            </label>
            <input id="f-email" class="field-input" type="email"
              placeholder="name@example.com" autocomplete="email" />
            <p id="f-email-err" class="err-msg" role="alert"></p>
          </div>

          <div class="field-wrap" style="margin-bottom:18px">
            <label class="field-label" for="f-name">
              Name <span class="field-opt">(optional)</span>
            </label>
            <input id="f-name" class="field-input" type="text"
              placeholder="How should we call you?" autocomplete="name" />
          </div>

          <button class="start-btn" id="start-btn">
            <i class="ti ti-message-circle" aria-hidden="true"></i>
            Start chat
          </button>
        </div>
        <p class="form-note">Your email lets us send you a chat transcript.</p>
      </div>
    </div>

    <!-- ══════════════════ CHAT VIEW ══════════════════ -->
    <div id="chat-view">
      <div id="chat-header">
        <div class="ch-inner">
          <button class="back-btn" id="back-btn" aria-label="Back">
            <i class="ti ti-arrow-left" aria-hidden="true"></i>
          </button>
          <div class="ch-avatar">
            <i class="ti ti-headset" style="font-size:18px;color:#fff" aria-hidden="true"></i>
          </div>
          <div>
            <p class="ch-name">Support Team</p>
            <p class="ch-status"><span class="online-dot"></span> Online</p>
          </div>
          <button class="opts-btn" aria-label="Options">
            <i class="ti ti-dots-vertical" aria-hidden="true"></i>
          </button>
        </div>
        <svg class="wave" viewBox="0 0 400 22" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,11 C100,22 300,0 400,11 L400,22 L0,22 Z" fill="#EEF4FF"/>
        </svg>
      </div>

      <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

      <div id="inputbar">
        <div class="input-inner">
          <input id="msg-input" type="text"
            placeholder="Type a message..." maxlength="500" aria-label="Message" />
          <button class="bar-icon" aria-label="Emoji">
            <i class="ti ti-mood-smile" aria-hidden="true"></i>
          </button>
          <button class="bar-icon" aria-label="Attach photo">
            <i class="ti ti-photo" aria-hidden="true"></i>
          </button>
          <button class="bar-icon" aria-label="Video">
            <i class="ti ti-video" aria-hidden="true"></i>
          </button>
        </div>
        <button class="send-btn" id="send-btn" disabled aria-label="Send">
          <i class="ti ti-send" aria-hidden="true"></i>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  const REPLIES = [
    "Thanks for reaching out! I'd be happy to help with that.",
    "I understand. Let me look into that for you right away.",
    "Great question! Could you share a bit more detail so I can better assist?",
    "Of course! I'll check on that and get back to you shortly.",
    "Got it — our team handles that regularly. Here's what you can do:",
    "Thanks for the info! Let me pull up your account and we'll sort this out.",
    "I appreciate your patience. Let me escalate this to the right team for you.",
  ];
  const MIN_TYPING_MS = 1400;
  const MAX_TYPING_MS = 2600;

  /* ── State ─────────────────────────────────────── */
  let replyIdx     = 0;
  let isTyping     = false;
  let userInitial  = 'U';
  let sessionEmail = '';      // email of active session
  let sessionOpen  = false;   // whether a session has been started

  /* ── DOM ───────────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const formView   = $('form-view');
  const chatView   = $('chat-view');
  const emailInput = $('f-email');
  const nameInput  = $('f-name');
  const emailErr   = $('f-email-err');
  const startBtn   = $('start-btn');
  const backBtn    = $('back-btn');
  const msgInput   = $('msg-input');
  const sendBtn    = $('send-btn');
  const messagesEl = $('messages');

  /* ── Helpers ───────────────────────────────────── */
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmt(d) {
    return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
  }
  function validateEmail(e) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());
  }
  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  /* ── Form error ────────────────────────────────── */
  function showErr(msg) {
    emailInput.classList.add('has-error');
    emailErr.style.display = 'block';
    emailErr.textContent   = msg;
    emailInput.focus();
  }
  function clearErr() {
    emailInput.classList.remove('has-error');
    emailErr.style.display = 'none';
    emailErr.textContent   = '';
  }
  emailInput.addEventListener('input', clearErr);

  /* ── Start / restore chat ──────────────────────── */
  function startChat() {
    const email = emailInput.value.trim();
    const name  = nameInput.value.trim();

    if (!email)                return showErr('Email is required to start the chat.');
    if (!validateEmail(email)) return showErr('Enter a valid email address.');

    const sameSession = sessionOpen && email.toLowerCase() === sessionEmail;

    if (!sameSession) {
      // Fresh session — clear old messages and reset
      sessionEmail   = email.toLowerCase();
      sessionOpen    = true;
      replyIdx       = 0;
      isTyping       = false;
      userInitial    = name ? name[0].toUpperCase() : email[0].toUpperCase();
      messagesEl.innerHTML = '';

      const greeting = name ? `Hi ${esc(name)}!` : 'Hi there!';
      addAgentMsg(`${greeting} 👋 Welcome to our support chat. How can we help you today?`);
    }
    // If same session: DOM already has messages — just show the view

    formView.style.display = 'none';
    chatView.style.display = 'flex';
    setTimeout(() => { scrollBottom(); msgInput.focus(); }, 60);
  }

  startBtn.addEventListener('click', startChat);
  emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') startChat(); });
  nameInput.addEventListener('keydown',  e => { if (e.key === 'Enter') startChat(); });

  /* ── Back — keep DOM intact ────────────────────── */
  backBtn.addEventListener('click', () => {
    isTyping               = false;
    msgInput.value         = '';
    sendBtn.disabled       = true;
    chatView.style.display = 'none';
    formView.style.display = 'flex';
  });

  /* ── Input ─────────────────────────────────────── */
  msgInput.addEventListener('input', () => {
    sendBtn.disabled = !msgInput.value.trim() || isTyping;
  });
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); trySend(); }
  });
  sendBtn.addEventListener('click', trySend);

  function trySend() {
    const text = msgInput.value.trim();
    if (!text || isTyping) return;

    msgInput.value   = '';
    sendBtn.disabled = true;
    addUserMsg(text);

    const d1 = rand(500, 900);
    const d2 = rand(MIN_TYPING_MS, MAX_TYPING_MS);

    setTimeout(() => {
      isTyping = true;
      showTyping();
      setTimeout(() => {
        hideTyping();
        isTyping = false;
        addAgentMsg(REPLIES[replyIdx % REPLIES.length]);
        replyIdx++;
      }, d2);
    }, d1);
  }

  /* ── Render ────────────────────────────────────── */
  function addAgentMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row msg-anim';
    row.innerHTML =
      `<div class="msg-avatar" aria-hidden="true"><i class="ti ti-headset" style="font-size:13px"></i></div>
       <div class="bubble-wrap">
         <div class="bubble agent">${text}</div>
         <span class="bubble-time">${fmt(new Date())}</span>
       </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function addUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user msg-anim';
    row.innerHTML =
      `<div class="msg-avatar user-av" aria-hidden="true">${esc(userInitial)}</div>
       <div class="bubble-wrap user">
         <div class="bubble user">${esc(text)}</div>
         <span class="bubble-time">${fmt(new Date())}</span>
       </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.id        = 'typing-indicator';
    row.className = 'typing-row';
    row.setAttribute('aria-label', 'Support is typing');
    row.innerHTML =
      `<div class="msg-avatar" aria-hidden="true"><i class="ti ti-headset" style="font-size:13px"></i></div>
       <div class="typing-bubble">
         <span class="dot"></span><span class="dot"></span><span class="dot"></span>
       </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

})();
</script>
</body>
</html>
